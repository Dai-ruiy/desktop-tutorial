<style>
:root{color-scheme:light;background:#eef3f4}
html,body{margin:0;min-height:100%;background:#eef3f4}
body{box-sizing:border-box;padding:0}
iframe{display:block;width:100%;min-height:100vh;height:100vh;margin:0;border:0;background:#eef3f4}


.site-tabs{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;padding:9px max(12px,calc((100% - 1096px)/2));background:#f8fafb;border-bottom:1px solid #d7e3e4;font:500 14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;white-space:nowrap;overflow:auto}
.site-tabs a,.map-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#365459;background:transparent;border:1px solid transparent;border-radius:7px;padding:8px 12px;text-decoration:none;font:inherit;cursor:pointer}
.site-tabs a[aria-selected=true],.map-button[aria-pressed=true]{background:#e3f2ef;border-color:#c1e0d9;color:#075f56}
.map-button:hover,.site-tabs a:hover{background:#eef4f4}
.site-tabs a:focus-visible,.map-button:focus-visible,.map-file:focus-within{outline:2px solid #087c71;outline-offset:2px}
#chart-frame[hidden],#holdings-map[hidden],[hidden]{display:none!important}
#holdings-map{max-width:1096px;margin:auto;padding:clamp(18px,4vw,42px) clamp(12px,4vw,25px) 48px;color:#142e33;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
#holdings-map *{box-sizing:border-box}
#holdings-map h1,#holdings-map h2,#holdings-map h3,#holdings-map p{margin:0}
#holdings-map h1{font-size:clamp(25px,4vw,39px);line-height:1.2;letter-spacing:-.04em;margin:8px 0 12px}
#holdings-map h2{font-size:22px;line-height:1.3}
#holdings-map h3{font-size:17px;line-height:1.4;margin:0 0 8px}
#holdings-map a:not(.map-button){color:#07685e;text-underline-offset:3px}
#holdings-map .map-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;color:#467279}
.map-meta{color:#526970;font-size:13px}
.map-box{background:#fff;border:1px solid #dce7e7;border-radius:12px;padding:clamp(12px,3vw,23px);margin-top:16px}
.map-box p+p{margin-top:8px!important}
.map-stack{display:grid;gap:14px}
.map-actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.map-file{display:inline-flex;width:fit-content;position:relative;cursor:pointer;border-radius:7px;padding:8px 13px;background:#0a6b60;color:#fff}
.map-file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.map-overflow{overflow:auto}
.map-table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.map-table :is(th,td){padding:9px 10px;border-bottom:1px solid #e7eeee;text-align:left}
.map-table th{font-size:12px;color:#4b6870;background:#f6f9fa}
.map-table tbody tr:last-child td{border-bottom:0}
.map-table td:last-child{white-space:normal}
.map-table td:nth-child(2) button{font-weight:650}
.map-detail{scroll-margin-top:65px}
.map-detail-head{border-bottom:1px solid #e4eeee;padding-bottom:13px}
.map-line{display:flex;gap:10px 20px;flex-wrap:wrap;align-items:baseline}
.map-number{font-size:25px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.map-tag{background:#e5f3f0;color:#0e645a;border-radius:100px;padding:3px 9px;font-size:12px;font-weight:700}
.map-legend{font-size:12px;color:#4b6870}
.map-chart{margin-top:9px;overflow:auto}
.map-chart svg{display:block;width:100%;min-width:500px}
.map-chart svg text{font-family:inherit}
.map-scenarios{display:grid;gap:9px}
.map-scenarios small{font-size:13px;color:#365459}
.map-rail{height:12px;position:relative;background:#edf3f3;border-radius:6px;margin-top:4px}
.map-rail span{height:100%;display:block;position:absolute;background:#74a3a1;border-radius:6px}
.map-rail[data-base=true] span{background:#188476}
.map-rail i{position:absolute;top:-3px;height:18px;border-left:2px solid #12303b}
.map-scenario-label{display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap}
.map-scenario-label b{min-width:43px}
.map-scenario-label strong{font-variant-numeric:tabular-nums}
.map-details{display:grid;gap:14px;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
.map-details>section{border:1px solid #e4eeee;border-radius:9px;padding:14px;min-width:0}
.map-error{color:#9b3732}
@media(max-width:720px){.map-details{grid-template-columns:1fr}.map-table :is(th,td){padding:7px 8px}}


.site-tabs span{padding:8px 12px;border:1px solid #c1e0d9;border-radius:7px;background:#e3f2ef;color:#075f56}
#holdings-map{box-sizing:border-box}
.map-freshness{border-left:3px solid #b97724;background:#fff7e8;border-radius:5px;padding:9px 12px;color:#65461a;font-size:13px}
.map-shortcuts{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}.map-shortcuts a{padding:4px 0} #map-stocks,#map-etfs,#map-history{scroll-margin-top:72px}
.map-hold-judgment{border-left:3px solid #168376;padding:8px 12px;background:#edf8f5;border-radius:4px}
.map-sort{display:flex;align-items:center;gap:8px;color:#365459;font-size:13px}
.map-sort select{font:inherit;padding:7px 10px;border:1px solid #bfd2d2;border-radius:6px;background:white;color:#142e33}
.map-sort select:focus-visible{outline:2px solid #087c71}
@media(max-width:600px){.map-chart svg{min-width:540px}.map-chart svg text{font-size:14px}.map-actions{gap:4px}.map-button{padding:8px 9px}.map-details>section{padding:13px}}
@media(max-width:600px){
  .site-tabs{padding-inline:12px}
  #map-stocks .map-table,
  #map-etfs .map-table,
  #map-stocks .map-table tbody,
  #map-etfs .map-table tbody{display:block}
  #map-stocks .map-table thead,
  #map-etfs .map-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  #map-stocks .map-table tbody tr,
  #map-etfs .map-table tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 0;border-bottom:1px solid #e7eeee}
  #map-stocks .map-table td,
  #map-etfs .map-table td{min-width:0;padding:3px 5px;border:0;white-space:normal}
  #map-stocks .map-table td::before,
  #map-etfs .map-table td::before{content:attr(data-label);display:block;font-size:11px;color:#4b6870}
  #map-stocks .map-table td:first-child button{padding:0;text-align:left}
  #map-stocks .map-table td:last-child,
  #map-etfs .map-table td:first-child,
  #map-etfs .map-table td:last-child{grid-column:1/-1}
}</style>

<script>
(async () => {
  const notice = document.getElementById('mobile-notice');
  let token = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
    try { token = localStorage.getItem('jybd-report-key-v1') || ''; } catch {}
  }
  if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
    notice.textContent = '首次使用，请粘贴完整解锁链接或访问密钥。解锁后，本浏览器可直接打开固定网址。';
    const input = document.createElement('input');
    input.type = 'password'; input.autocomplete = 'off'; input.placeholder = '粘贴解锁链接或访问密钥'; input.setAttribute('aria-label', '解锁链接或访问密钥');
    const button = document.createElement('button'); button.type='button'; button.className='map-button'; button.textContent='打开报告';
    button.addEventListener('click', () => { let value = input.value.trim(); try { if (value.startsWith('https:') || value.startsWith('http:')) value = new URL(value).hash.slice(1); } catch {} if (!/^[A-Za-z0-9_-]{43}$/.test(value)) { notice.textContent = '链接或密钥格式不正确，请粘贴完整的首次解锁链接或密钥。'; return; } location.hash = value; location.reload(); });
    notice.after(input, button); return;
  }
  let unlocked = false;
  try {
    const decode = (text) => Uint8Array.from(atob(text), char => char.charCodeAt(0));
    const rawKey = decode(token.replace(/-/g, '+').replace(/_/g, '/') + '=');
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const packed = decode(document.getElementById('mobile-ciphertext').textContent.trim());
    const bytes = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: packed.slice(0, 12) }, key, packed.slice(12));
    unlocked = true;
    try { localStorage.setItem('jybd-report-key-v1', token); } catch {}
    const embedded = document.createElement('script');
    embedded.id = 'holdings-map-data';
    embedded.type = 'application/json';
    embedded.textContent = new TextDecoder().decode(bytes);
    document.body.append(embedded);
    (() => {
  const byId = (id) => document.getElementById(id);
  const holdingsHash = '#holdings-2026-11-10';
  const embedded = byId('holdings-map-data');
  const report = byId('map-report');
  const importPanel = byId('map-import');
  const fileInput = byId('map-file');
  const status = byId('map-import-status');
  const svgNS = 'http://www.w3.org/2000/svg';
  let selected = 0;
  let days = 60;
  let sortMode = 'holding';
  let payload;

  function html(tag, className, content) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (content !== undefined) element.textContent = content;
    return element;
  }

  function svg(tag, attrs, content) {
    const element = document.createElementNS(svgNS, tag);
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, String(value));
    if (content !== undefined) element.textContent = content;
    return element;
  }

  function tabState() {
    if (!byId('chart-frame')) return;
    const showHoldings = location.hash === holdingsHash || (!location.hash && embedded);
    byId('chart-frame').hidden = Boolean(showHoldings);
    byId('holdings-map').hidden = !showHoldings;
    byId('industry-tab').setAttribute('aria-selected', String(!showHoldings));
    byId('holdings-tab').setAttribute('aria-selected', String(Boolean(showHoldings)));
    if (!showHoldings) window.dispatchEvent(new Event('resize'));
  }

  function button(label, onClick, active, attrs = {}) {
    const element = html('button', 'map-button', label);
    element.type = 'button';
    if (active !== undefined) element.setAttribute('aria-pressed', String(active));
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
    element.addEventListener('click', onClick);
    return element;
  }

  function table(headers, rows) {
    const wrapper = html('div', 'map-overflow');
    const element = html('table', 'map-table');
    const head = element.createTHead().insertRow();
    for (const header of headers) {
      const th = html('th', '', header);
      th.scope = 'col';
      head.append(th);
    }
    const body = element.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      for (const [index, value] of row.entries()) {
        const cell = tr.insertCell();
        cell.dataset.label = headers[index];
        cell.append(value);
      }
    }
    wrapper.append(element);
    return wrapper;
  }

  function stack(title, className = 'map-box map-stack') {
    const section = html('section', className);
    if (title) section.append(html('h2', '', title));
    return section;
  }

  const yuan = (number) => number.toFixed(2);
  const percentage = (number) => number.toFixed(2) + '%';
  const span = (low, high) => low === high ? yuan(low) : yuan(low) + '–' + yuan(high);
  const valuation = (s) => s.bookCases ? 'PB 压力测试' : s.scenarios ? '情景 ' + span(s.scenarios[1][0]*s.scenarios[1][1], s.scenarios[1][0]*s.scenarios[1][2]) + ' 元' : '亏损修复观察';
  const rangeColors = { 支撑: '#197d8a', 压力: '#9e6027', 前低: '#647681', '近20日低':'#197d8a', '近5日高':'#9e6027' };

  function chart(stock) {
    const bars = payload.history[stock.symbol].slice(-days);
    const plot = svg('svg', { viewBox: '0 0 760 300', role: 'img',
      'aria-label': stock.name + '前复权日 K 线，价格单位为元' });
    const left = 52, right = 637, top = 18, bottom = 249;
    const low = Math.min(...bars.map(b => b[3]), ...stock.bands.map(b => b[1]));
    const high = Math.max(...bars.map(b => b[2]), ...stock.bands.map(b => b[2]));
    const pad = (high - low) * 0.075 || 1;
    const step = (right - left) / bars.length;
    const x = (i) => left + step * (i + 0.5);
    const y = (p) => bottom - (p - low + pad) / (high - low + 2 * pad) * (bottom - top);
    const line = (x1, y1, x2, y2, stroke, extra = {}) => svg('line', {x1, y1, x2, y2, stroke, ...extra});
    const label = (x, y, text, fill = '#48676b', extra = {}) => svg('text', {x, y, fill, 'font-size': 11, ...extra}, text);
    plot.append(label(6, 13, '价格（元）'));
    for (let i = 0; i <= 5; i++) {
      const price = low + (high - low) * i / 5;
      const at = y(price);
      plot.append(line(left, at, right, at, '#dce9ea'), label(left - 8, at + 4, yuan(price), '#48676b', {'text-anchor': 'end'}));
    }
    const labels = stock.bands.map(([kind, lo, hi]) => ({kind, lo, hi, at: y((lo + hi) / 2)})).sort((a,b) => a.at - b.at);
    for (const [i, item] of labels.entries()) {
      item.label = Math.max(item.at, i ? labels[i - 1].label + 15 : top + 5);
    }
    for (let i = labels.length - 1; i >= 0; i--) {
      labels[i].label = Math.min(labels[i].label, i < labels.length - 1 ? labels[i + 1].label - 15 : bottom - 4);
    }
    for (const {kind, lo, hi, at, label: labelY} of labels) {
      const tint = rangeColors[kind];
      plot.append(svg('rect', {x: left, y: y(hi), width: right - left, height: Math.max(1, y(lo) - y(hi)), fill: tint, opacity: '.13'}));
      plot.append(line(left, y(hi), right, y(hi), tint, {'stroke-dasharray': '4 3', opacity: '.65'}));
      plot.append(line(right, at, right + 9, labelY, tint, {opacity: '.7'}), label(right + 12, labelY + 4, kind + ' ' + span(lo, hi), tint));
    }
    for (const [i, bar] of bars.entries()) {
      const [date, open, high, low, close] = bar;
      const color = close >= open ? '#bb414a' : '#197b64';
      const group = svg('g', {opacity: i === bars.length - 1 ? '.76' : '1'});
      group.append(svg('title', {}, date + ' 开 ' + yuan(open) + ' 高 ' + yuan(high) + ' 低 ' + yuan(low) +
        ' 收 ' + yuan(close)));
      group.append(line(x(i), y(high), x(i), y(low), color));
      group.append(svg('rect', {x: x(i) - step * .30, y: y(Math.max(open, close)),
        width: step * .60, height: Math.max(1.1, Math.abs(y(open) - y(close))), fill: color}));
      plot.append(group);
    }
    plot.append(line(left, y(stock.price), right, y(stock.price), '#135e9c', {'stroke-dasharray': '5 3', 'stroke-width': 1.3}));
    plot.append(svg('circle', {cx: x(bars.length - 1), cy: y(stock.price), r: 4, fill: '#135e9c', stroke: '#fff', 'stroke-width': 1}));
    plot.append(line(left,bottom,right,bottom,'#a9bec0'));
    for (const fraction of [0, 1/3, 2/3, 1]) {
      const i = Math.floor((bars.length - 1) * fraction);
      plot.append(label(x(i), bottom + 18, bars[i][0].slice(5), '#48676b', {'text-anchor': 'middle'}));
    }
    plot.append(label((left + right) / 2, 289, '交易日期（月–日）', '#48676b', {'text-anchor': 'middle'}));
    const container = html('div', 'map-chart');
    container.append(plot);
    return container;
  }

  function load(text) {
    const parsed = JSON.parse(text);
    if (!Array.isArray(parsed.stocks) || parsed.stocks.length !== 5 || !parsed.history) throw Error();
    for (const s of parsed.stocks) {
      const bars = parsed.history[s.symbol];
      if (!/^\d{6}\.(SH|SZ)$/.test(s.symbol) || !Number.isFinite(s.price) ||
          !Array.isArray(s.bands) || !Array.isArray(bars) || bars.length !== 121 ||
          bars.at(-1)[4] !== s.price) throw Error();
    }
    if (parsed.etfs !== undefined &&
        (!Array.isArray(parsed.etfs) || parsed.etfs.length !== 2 || parsed.etfs.some(fund =>
          !/^\d{6}\.(SH|SZ)$/.test(fund.symbol) || !Number.isFinite(fund.price) ||
          !Number.isFinite(fund.weight) || !Array.isArray(fund.source)) ||
          parsed.stocks.some(s => !Number.isFinite(s.weight)))) throw Error();
    payload=parsed;
    selected=0;
    days=60;
    render();
  }

  fileInput?.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      if (file.size > 3000000) throw Error();
      const source = await file.text();
      const startTag = '<script id="holdings-map-data" type="application/json">';
      const start = source.indexOf(startTag);
      if (start < 0) throw Error();
      const startOfData = start + startTag.length;
      const end = source.indexOf('<' + '/script>',startOfData);
      if (end < 0) throw Error();
      load(source.slice(startOfData,end));
      status.hidden=true;
    } catch {
      status.hidden=false;
      status.textContent='这个文件没有可读取的持仓报告，请选择 11 月 10 日完整版 HTML。';
      fileInput.value='';
    }
  });
  window.addEventListener('hashchange', tabState);
  tabState();
  if (embedded) load(embedded.textContent);
})();


  } catch {
    notice.textContent = unlocked ? '报告已解密，但页面加载失败，请刷新后重试。' : '无法解锁报告，请从原消息重新打开完整专用链接。';
  }
})();</script>
