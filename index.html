  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],

  border-color: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

<script>
(() => {
  const byId = (id) => document.getElementById(id);
  const holdingsHash = '#holdings-2026-11-10';
  const embedded = byId('holdings-map-data');
  const report = byId('map-report');
  const importPanel = byId('map-import');
  const fileInput = byId('map-file');
  const status = byId('map-import-status');
  const svgNS = 'http://www.w3.org/2000/svg';
  let selected = 0;
  let days = 60;
  let payload;

  function html(tag, className, content) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (content !== undefined) element.textContent = content;
    return element;
  }

  function svg(tag, attrs, content) {
    const element = document.createElementNS(svgNS, tag);
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, String(value));
    if (content !== undefined) element.textContent = content;
    return element;
  }

  function tabState() {
    const showHoldings = location.hash === holdingsHash || (!location.hash && embedded);
    byId('chart-frame').hidden = Boolean(showHoldings);
    byId('holdings-map').hidden = !showHoldings;
    byId('industry-tab').setAttribute('aria-selected', String(!showHoldings));
    byId('holdings-tab').setAttribute('aria-selected', String(Boolean(showHoldings)));
    if (!showHoldings) window.dispatchEvent(new Event('resize'));
  }

  function button(label, onClick, active, attrs = {}) {
    const element = html('button', 'map-button', label);
    element.type = 'button';
    if (active !== undefined) element.setAttribute('aria-pressed', String(active));
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
    element.addEventListener('click', onClick);
    return element;
  }

  function table(headers, rows) {
    const wrapper = html('div', 'map-overflow');
    const element = html('table', 'map-table');
    const head = element.createTHead().insertRow();
    for (const header of headers) {
      const th = html('th', '', header);
      th.scope = 'col';
      head.append(th);
    }
    const body = element.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      for (const value of row) tr.insertCell().append(value);
    }
    wrapper.append(element);
    return wrapper;
  }

  function stack(title, className = 'map-box map-stack') {
    const section = html('section', className);
    if (title) section.append(html('h2', '', title));
    return section;
  }

  const yuan = (number) => number.toFixed(2);
  const percentage = (number) => number.toFixed(2) + '%';
  const span = (low, high) => low === high ? yuan(low) : yuan(low) + '–' + yuan(high);
  const valuation = (s) => s.eps > 0
    ? (s.price / s.eps).toFixed(1) + ' 倍滚动 PE'
    : (s.price / s.bps).toFixed(2) + ' 倍 PB · 滚动亏损';
  const rangeColors = { 支撑: '#197d8a', 压力: '#9e6027', 前低: '#647681' };

  function chart(stock) {
    const bars = payload.history[stock.symbol].slice(-days - 1);
    const plot = svg('svg', { viewBox: '0 0 760 300', role: 'img',
      'aria-label': stock.name + '前复权日 K 线，价格单位为元' });
    const left = 52, right = 637, top = 18, bottom = 249;
    const low = Math.min(...bars.map(b => b[3]), ...stock.bands.map(b => b[1]));
    const high = Math.max(...bars.map(b => b[2]), ...stock.bands.map(b => b[2]));
    const pad = (high - low) * 0.075 || 1;
    const step = (right - left) / bars.length;
    const x = (i) => left + step * (i + 0.5);
    const y = (p) => bottom - (p - low + pad) / (high - low + 2 * pad) * (bottom - top);
    const line = (x1, y1, x2, y2, stroke, extra = {}) => svg('line', {x1, y1, x2, y2, stroke, ...extra});
    const label = (x, y, text, fill = '#48676b', extra = {}) => svg('text', {x, y, fill, 'font-size': 11, ...extra}, text);
    plot.append(label(6, 13, '价格（元）'));
    for (let i = 0; i <= 5; i++) {
      const price = low + (high - low) * i / 5;
      const at = y(price);
      plot.append(line(left, at, right, at, '#dce9ea'), label(left - 8, at + 4, yuan(price), '#48676b', {'text-anchor': 'end'}));
    }
    const labels = stock.bands.map(([kind, lo, hi]) => ({kind, lo, hi, at: y((lo + hi) / 2)})).sort((a,b) => a.at - b.at);
    for (const [i, item] of labels.entries()) {
      item.label = Math.max(item.at, i ? labels[i - 1].label + 15 : top + 5);
    }
    for (let i = labels.length - 1; i >= 0; i--) {
      labels[i].label = Math.min(labels[i].label, i < labels.length - 1 ? labels[i + 1].label - 15 : bottom - 4);
    }
    for (const {kind, lo, hi, at, label: labelY} of labels) {
      const tint = rangeColors[kind];
      plot.append(svg('rect', {x: left, y: y(hi), width: right - left, height: Math.max(1, y(lo) - y(hi)), fill: tint, opacity: '.13'}));
      plot.append(line(left, y(hi), right, y(hi), tint, {'stroke-dasharray': '4 3', opacity: '.65'}));
      plot.append(line(right, at, right + 9, labelY, tint, {opacity: '.7'}), label(right + 12, labelY + 4, span(lo, hi), tint));
    }
    for (const [i, bar] of bars.entries()) {
      const [date, open, high, low, close] = bar;
      const color = close >= open ? '#bb414a' : '#197b64';
      const group = svg('g', {opacity: i === bars.length - 1 ? '.76' : '1'});
      group.append(svg('title', {}, date + ' 开 ' + yuan(open) + ' 高 ' + yuan(high) + ' 低 ' + yuan(low) +
        (i === bars.length - 1 ? ' 午盘 ' : ' 收 ') + yuan(close)));
      group.append(line(x(i), y(high), x(i), y(low), color));
      group.append(svg('rect', {x: x(i) - step * .30, y: y(Math.max(open, close)),
        width: step * .60, height: Math.max(1.1, Math.abs(y(open) - y(close))), fill: color}));
      plot.append(group);
    }
    plot.append(line(left, y(stock.price), right, y(stock.price), '#135e9c', {'stroke-dasharray': '5 3', 'stroke-width': 1.3}));
    plot.append(svg('circle', {cx: x(bars.length - 1), cy: y(stock.price), r: 4, fill: '#135e9c', stroke: '#fff', 'stroke-width': 1}));
    plot.append(line(left,bottom,right,bottom,'#a9bec0'));
    for (const fraction of [0, 1/3, 2/3, 1]) {
      const i = Math.floor((bars.length - 1) * fraction);
      plot.append(label(x(i), bottom + 18, bars[i][0].slice(5), '#48676b', {'text-anchor': 'middle'}));
    }
    plot.append(label((left + right) / 2, 289, '交易日期（月–日）', '#48676b', {'text-anchor': 'middle'}));
    const container = html('div', 'map-chart');
    container.append(plot);
    return container;
  }

  function valuationPanel(s) {
    const section = html('section', 'map-stack');
    section.append(html('h3', '', s.scenarios ? '2027 年情景估值' : '盈利修复门槛'));
    section.append(html('p', 'map-meta', s.assumptions));
    if (!s.scenarios) {
      section.append(table(['假设估值', '所需年归母净利润（亿元）'], [25, 30, 35].map(pe =>
        [pe + ' 倍 PE', (s.price * s.shareCapital / 1e8 / pe).toFixed(2)])));
      section.append(html('p', 'map-meta', '午盘市值 ÷ 示例市盈率。滚动亏损股先看盈利和现金流能否修复。'));
      return section;
    }
    const upper = Math.max(s.price, ...s.scenarios.map(([eps,, high]) => eps * high)) * 1.06;
    const bars = html('div', 'map-scenarios');
    const names = ['保守', '基准', '乐观'];
    for (const [i, [eps, lo, hi]] of s.scenarios.entries()) {
      const start = eps * lo;
      const end = eps * hi;
      const group = html('div');
      const label = html('div', 'map-scenario-label');
      label.append(html('b', '', names[i]), html('strong', '', span(start, end) + ' 元'),
        html('small', '', 'EPS ' + yuan(eps) + ' 元 × ' + lo + '–' + hi + ' 倍'));
      const rail = html('div', 'map-rail');
      rail.dataset.base = String(i === 1);
      const segment = html('span');
      segment.style.left = (start / upper * 100) + '%';
      segment.style.width = ((end - start) / upper * 100) + '%';
      const current = html('i');
      current.title = '午盘价 ' + yuan(s.price) + ' 元';
      current.style.left = (s.price / upper * 100) + '%';
      rail.append(segment, current);
      group.append(label, rail);
      bars.append(group);
    }
    section.append(bars, html('p', 'map-meta', '竖线为午盘价 ' + yuan(s.price) + ' 元。每股盈利和市盈率为分析假设。'));
    return section;
  }

  function sourceLink([label, url]) {
    if (typeof url !== 'string' || !url.startsWith('https://')) return '';
    const link = html('a', '', label);
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    return link;
  }

  function reviewPanel(s) {
    const section = html('section', 'map-stack');
    section.append(html('h3', '', '下一次复核'));
    section.append(html('p', '', s.facts), html('p', '', s.check), html('p', 'map-meta', s.invalidate));
    const links = html('div', 'map-actions');
    const sources = [['2026 三季报', s.report], ['2025 财务披露', s.annual],
      ...(s.extra ? [s.extra] : []), ...(s.sources ?? [])];
    links.append(...sources.map(sourceLink));
    section.append(links);
    return section;
  }

  function stockDetail(detail) {
    const s = payload.stocks[selected];
    const header = html('header','map-detail-head map-stack');
    const title = html('div','map-line');
    title.append(html('h2', '', s.name + ' ' + s.symbol.slice(0,6)), html('span','map-tag',s.tag));
    const stats = html('div','map-line');
    const change = (s.price / s.prev - 1) * 100;
    stats.append(html('strong','map-number',yuan(s.price) + ' 元'), html('span','',valuation(s)),
      html('span','map-meta','较昨收 ' + (change >= 0 ? '+' : '') + change.toFixed(2) + '% · ' + s.time));
    const weightLabel = payload.etfs ? '午盘估算仓位 ' : '11/03 截图权重 ';
    const holding = s.shares + ' 股' + (s.weight === null ? ' · 11/10 用户确认' : ' · ' + weightLabel + percentage(s.weight)) +
      (s.cost === null ? ' · 成本待确认' : ' · 成本 ' + yuan(s.cost) + ' 元');
    header.append(title, stats, html('p','map-meta',holding), html('p','',s.summary));

    const chartArea = html('section','map-stack');
    const chartHead = html('div','map-line');
    const range = html('div','map-actions');
    for (const n of [30, 60, 120]) range.append(button(n + ' 日', () => {
      days = n;
      stockDetail(detail);
      detail.querySelector('[data-days="' + n + '"]').focus({preventScroll:true});
    }, days === n, {'data-days': String(n)}));
    chartHead.append(html('h3','',s.name + '日 K 线与技术区间'),range);
    chartArea.append(chartHead, html('p','map-legend','红涨、绿跌 · 青色支撑 · 橙色压力 · 灰色前低 · 蓝线午盘价'),chart(s));
    const from = payload.history[s.symbol].slice(-days-1)[0][0];
    chartArea.append(html('p','map-meta','长桥前复权日线 · ' + from + ' 至 2026-11-10 · 末根为午盘快照'));
    chartArea.append(table(['位置','价格（元）','历史依据'],s.bands.map(([kind,lo,hi,evidence]) => [kind,span(lo,hi),evidence])));

    const panels = html('div','map-details');
    panels.append(valuationPanel(s),reviewPanel(s));
    detail.replaceChildren(header,chartArea,panels);
  }

  function render() {
    const overview = stack('综合排名');
    overview.append(html('p','',payload.overview));
    const detail = stack(null, 'map-box map-stack map-detail');
    detail.id = 'map-stock-detail';
    function choose(index, scroll) {
      selected = index;
      render();
      if (scroll) byId('map-stock-detail').scrollIntoView({block:'start'});
      else report.querySelector('[data-stock-index="' + index + '"]').focus({preventScroll:true});
    }
    const weightHeading = payload.etfs ? '午盘估算仓位' : '权重或股数';
    overview.append(table(['排名','股票','午盘价（元）','估值',weightHeading,'组合判断'],
      payload.stocks.map((s,i) => [String(s.rank),button(s.name,()=>choose(i,true)),yuan(s.price),valuation(s),
        s.weight === null ? s.shares + ' 股' : percentage(s.weight),s.tag])));
    overview.append(html('p','map-meta',payload.snapshotNote));

    const tickerButtons = html('nav','map-actions');
    tickerButtons.setAttribute('aria-label','切换持仓图卡');
    for (const [i,s] of payload.stocks.entries()) tickerButtons.append(button(s.name,()=>choose(i,false),selected===i,{'data-stock-index':String(i)}));
    stockDetail(detail);
    const etfs = stack(payload.etfs ? 'ETF 持仓' : 'ETF 与 AI 敞口');
    etfs.id = 'map-etfs';
    etfs.append(html('p','map-meta',payload.etfNote));
    if (payload.etfs) {
      etfs.append(table(['基金','代码','份额','午盘价（元）','午盘估算仓位','组合敞口与复核'],
        payload.etfs.map(fund => {
          const comment = html('div','map-stack');
          comment.append(html('p','',fund.analysis), sourceLink(fund.source));
          return [fund.name,fund.symbol.slice(0,6),String(fund.shares),fund.price.toFixed(3),percentage(fund.weight),comment];
        })));
    }
    report.replaceChildren(overview,etfs,tickerButtons,detail);
    report.className='map-stack';
    importPanel.hidden=true;
  }

  function load(text) {
    const parsed = JSON.parse(text);
    if (!Array.isArray(parsed.stocks) || parsed.stocks.length !== 6 || !parsed.history) throw Error();
    for (const s of parsed.stocks) {
      const bars = parsed.history[s.symbol];
      if (!/^\d{6}\.(SH|SZ)$/.test(s.symbol) || !Number.isFinite(s.price) ||
          !Array.isArray(s.bands) || !Array.isArray(bars) || bars.length !== 121 ||
          bars.at(-1)[4] !== s.price) throw Error();
    }
    if (parsed.etfs !== undefined &&
        (!Array.isArray(parsed.etfs) || parsed.etfs.length !== 2 || parsed.etfs.some(fund =>
          !/^\d{6}\.(SH|SZ)$/.test(fund.symbol) || !Number.isFinite(fund.price) ||
          !Number.isFinite(fund.weight) || !Array.isArray(fund.source)) ||
          parsed.stocks.some(s => !Number.isFinite(s.weight)))) throw Error();
    payload=parsed;
    selected=0;
    days=60;
    render();
  }

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      if (file.size > 3000000) throw Error();
      const source = await file.text();
      const startTag = '<script id="holdings-map-data" type="application/json">';
      const start = source.indexOf(startTag);
      if (start < 0) throw Error();
      const startOfData = start + startTag.length;
      const end = source.indexOf('<' + '/script>',startOfData);
      if (end < 0) throw Error();
      load(source.slice(startOfData,end));
      status.hidden=true;
    } catch {
      status.hidden=false;
      status.textContent='这个文件没有可读取的持仓报告，请选择 11 月 10 日完整版 HTML。';
      fileInput.value='';
    }
  });
  window.addEventListener('hashchange', tabState);
  tabState();
  if (embedded) load(embedded.textContent);
})();

</script>
</body>
</html>
